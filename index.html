<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>2026 Festival Tetris</title>
  <meta name="description" content="2026 페스티벌 테트리스 — 브라우저에서 바로 즐기는 테트리스" />
  <meta name="theme-color" content="#070a12" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23070a12'/%3E%3Crect x='3' y='13' width='8' height='8' fill='%232ee6ff'/%3E%3Crect x='12' y='13' width='8' height='8' fill='%232ee6ff'/%3E%3Crect x='21' y='13' width='8' height='8' fill='%232ee6ff'/%3E%3Crect x='12' y='4' width='8' height='8' fill='%23c56bff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 class="title"><span class="t-year">2026</span> FESTIVAL <span class="t-tetris">TETRIS</span></h1>
      <div class="topbar-actions">
        <button id="btn-sfx" class="icon-btn" type="button" title="효과음 (M)" aria-label="효과음">🔊</button>
        <button id="btn-bgm" class="icon-btn" type="button" title="배경음악" aria-label="배경음악">🎵</button>
        <button id="btn-pause" class="icon-btn" type="button" title="일시정지 (P)" aria-label="일시정지">⏸</button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel panel-left">
        <section class="box box-hold">
          <h2>HOLD</h2>
          <canvas id="hold"></canvas>
        </section>
        <section class="box box-stats stats">
          <div class="stat"><span class="label">SCORE</span><span id="score" class="value">0</span></div>
          <div class="stat"><span class="label">LEVEL</span><span id="level" class="value">1</span></div>
          <div class="stat"><span class="label">LINES</span><span id="lines" class="value">0</span></div>
          <div class="stat"><span class="label">BEST</span><span id="best" class="value">0</span></div>
        </section>
      </aside>

      <section id="stage" class="stage">
        <div id="board-wrap" class="board-wrap">
          <canvas id="board"></canvas>
          <div id="fx" class="fx"></div>
          <div id="overlay" class="overlay">
            <div id="screen-start" class="screen active">
              <div class="logo">
                <span class="t-year">2026</span><br />FESTIVAL<br /><span class="t-tetris">TETRIS</span>
              </div>
              <p class="hint">레벨을 고르고 시작하세요</p>
              <div id="level-picker" class="level-picker"></div>
              <button id="btn-start" class="btn primary" type="button">시작 <kbd>Enter</kbd></button>
              <div class="rank">
                <h3>TOP 5</h3>
                <table id="start-board" class="board-table"></table>
              </div>
            </div>

            <div id="screen-pause" class="screen">
              <h2 class="screen-title">PAUSED</h2>
              <p class="hint">일시정지 중</p>
              <button id="btn-resume" class="btn primary" type="button">계속 <kbd>P</kbd></button>
              <button id="btn-restart" class="btn" type="button">다시 시작 <kbd>R</kbd></button>
            </div>

            <div id="screen-over" class="screen">
              <h2 class="screen-title">GAME OVER</h2>
              <div class="result">
                <div><span class="label">SCORE</span><strong id="over-score">0</strong></div>
                <div><span class="label">LINES</span><strong id="over-lines">0</strong></div>
                <div><span class="label">LEVEL</span><strong id="over-level">1</strong></div>
              </div>
              <form id="name-form" class="name-form" hidden autocomplete="off">
                <p class="new-record">🎉 NEW RECORD! 이름을 입력하세요</p>
                <input id="name-input" type="text" maxlength="10" placeholder="이름" enterkeyhint="done" />
                <button class="btn primary" type="submit">등록</button>
              </form>
              <div class="rank">
                <h3>RANKING</h3>
                <table id="over-board" class="board-table"></table>
              </div>
              <button id="btn-again" class="btn primary" type="button">다시 시작 <kbd>Enter</kbd></button>
              <button id="btn-menu" class="btn" type="button">레벨 선택</button>
            </div>
          </div>
        </div>
      </section>

      <aside class="panel panel-right">
        <section class="box box-next">
          <h2>NEXT</h2>
          <canvas id="next"></canvas>
        </section>
        <section class="box box-help help">
          <h2>조작</h2>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> 이동</li>
            <li><kbd>↓</kbd> 소프트 드롭</li>
            <li><kbd>Space</kbd> 하드 드롭</li>
            <li><kbd>↑</kbd><kbd>X</kbd> 회전</li>
            <li><kbd>Z</kbd> 반대 회전</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> 홀드</li>
            <li><kbd>P</kbd> 일시정지</li>
            <li><kbd>R</kbd> 다시 시작</li>
          </ul>
        </section>
      </aside>
    </main>

    <div id="touch" class="touch">
      <button class="tbtn" data-action="hold" type="button">HOLD</button>
      <button class="tbtn" data-action="ccw" type="button">⟲</button>
      <button class="tbtn" data-action="cw" type="button">⟳</button>
      <button class="tbtn accent" data-action="hard" type="button">DROP</button>
      <button class="tbtn" data-action="left" type="button">◀</button>
      <button class="tbtn" data-action="down" type="button">▼</button>
      <button class="tbtn" data-action="right" type="button">▶</button>
      <button class="tbtn" data-action="pause" type="button">⏸</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
