<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2026 Digitalarts Tetris</title>
  <meta name="description" content="2026 Digitalarts Tetris — 조각이 바로 바닥에 꽂히는 초고속 테트리스" />
  <meta name="theme-color" content="#05060a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23070a12'/%3E%3Crect x='3' y='13' width='8' height='8' fill='%23a1d3e8'/%3E%3Crect x='12' y='13' width='8' height='8' fill='%23a1d3e8'/%3E%3Crect x='21' y='13' width='8' height='8' fill='%23a1d3e8'/%3E%3Crect x='12' y='4' width='8' height='8' fill='%23ff47c0'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

  <div id="app">
    <header class="topbar">
      <div class="title"><span class="t-year">2026</span> DIGITALARTS <span class="t-tetris">TETRIS</span></div>
      <div class="topbar-actions">
        <button id="btn-sfx" class="icon-btn" type="button" title="효과음 (M)" aria-label="효과음">🔊</button>
        <button id="btn-bgm" class="icon-btn" type="button" title="배경음악" aria-label="배경음악">🎵</button>
        <button id="btn-pause" class="icon-btn" type="button" title="일시정지 (P)" aria-label="일시정지">⏸</button>
        <button id="btn-full" class="icon-btn" type="button" title="전체화면 (F)" aria-label="전체화면">⛶</button>
      </div>
    </header>

    <main id="arena" class="arena">
      <aside class="side side-left">
        <div class="block">
          <span class="label">HOLD</span>
          <canvas id="hold"></canvas>
        </div>
        <div class="block">
          <span class="label">SCORE</span>
          <span id="score" class="value big">0</span>
        </div>
        <div class="block">
          <span class="label">BEST</span>
          <span id="best" class="value hot">0</span>
        </div>
      </aside>

      <section id="stage" class="stage">
        <div id="board-wrap" class="board-wrap">
          <canvas id="board"></canvas>
          <div id="fx" class="fx"></div>
        </div>
      </section>

      <aside class="side side-right">
        <div class="block">
          <span class="label">NEXT</span>
          <canvas id="next"></canvas>
        </div>
        <div class="block">
          <span class="label">LEVEL</span>
          <span id="level" class="value">1</span>
        </div>
        <div class="block">
          <span class="label">LINES</span>
          <span id="lines" class="value">0</span>
        </div>
        <div class="block">
          <span class="label">TIME</span>
          <span id="time" class="value">0:00</span>
        </div>
      </aside>
    </main>
  </div>

  <div id="overlay" class="overlay">
    <div id="screen-start" class="screen active">
      <div class="logo">
        <span class="t-year">2026</span><br />
        <span class="t-mid">DIGITALARTS</span><br />
        <span class="t-tetris">TETRIS</span>
      </div>
      <p class="tagline">조각이 나오자마자 바닥에 꽂히는 초고속 테트리스<br />점수가 오를수록 고정 시간이 짧아집니다</p>
      <button id="btn-start" class="btn primary huge" type="button">START <kbd>Enter</kbd></button>
      <p class="keys">
        <span><kbd>←</kbd><kbd>→</kbd> 이동</span>
        <span><kbd>↑</kbd> 회전</span>
        <span><kbd>Z</kbd> 반대 회전</span>
        <span><kbd>Space</kbd> 고정</span>
        <span><kbd>C</kbd> 홀드</span>
        <span><kbd>P</kbd> 일시정지</span>
        <span><kbd>F</kbd> 전체화면</span>
      </p>
      <div class="rank">
        <h3>TOP 5</h3>
        <table id="start-board" class="board-table"></table>
      </div>
    </div>

    <div id="screen-pause" class="screen">
      <h2 class="screen-title">PAUSED</h2>
      <div class="btn-row">
        <button id="btn-resume" class="btn primary" type="button">계속 <kbd>P</kbd></button>
        <button id="btn-restart" class="btn" type="button">다시 시작 <kbd>R</kbd></button>
      </div>
    </div>

    <div id="screen-over" class="screen">
      <h2 class="screen-title danger">GAME OVER</h2>
      <div id="over-score" class="final-score">0</div>
      <div class="result">
        <div><span class="label">LINES</span><strong id="over-lines">0</strong></div>
        <div><span class="label">LEVEL</span><strong id="over-level">1</strong></div>
        <div><span class="label">TIME</span><strong id="over-time">0:00</strong></div>
      </div>
      <form id="name-form" class="name-form" hidden autocomplete="off">
        <p class="new-record">🎉 NEW RECORD! 이름을 입력하세요</p>
        <div class="name-row">
          <input id="name-input" type="text" maxlength="10" placeholder="이름" enterkeyhint="done" />
          <button class="btn primary" type="submit">등록</button>
        </div>
      </form>
      <div class="rank">
        <h3>RANKING</h3>
        <table id="over-board" class="board-table"></table>
      </div>
      <div class="btn-row">
        <button id="btn-again" class="btn primary" type="button">다시 시작 <kbd>Enter</kbd></button>
        <button id="btn-menu" class="btn" type="button">메인 화면</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
